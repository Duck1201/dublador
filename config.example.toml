# Copy to config.toml (git-ignored) and adjust. See docs/ARCHITECTURE.md#configuração.
# Lookup: $DUBLADOR_CONFIG, then ./config.toml, then $XDG_CONFIG_HOME/dublador/config.toml.
# Sections other than the ones below (e.g. [synthesize]) are stage settings, passed through to the stages.
# Precedence: CLI flags > environment variables > config.toml > defaults.

[paths]
work_dir   = "~/dublador/work"     # env: DUBLADOR_WORK_DIR
models_dir = "~/dublador/models"   # env: DUBLADOR_MODELS_DIR
venvs_dir  = "~/dublador/venvs"    # env: DUBLADOR_VENVS_DIR — keep on the same filesystem as uv_cache_dir
uv_cache_dir = "~/dublador/uv-cache"  # env: UV_CACHE_DIR
# Paths must be absolute or start with ~; $VARS are expanded.

[languages]
source = "en"
target = "pt-BR"

[translate]
model = "gemma4:e4b-it-qat"        # provisional default, see docs/MODELS.md
ollama_url = "http://localhost:11434"

[separate]
# model = "model_bs_roformer_ep_317_sdr_12.9755.ckpt"
# chunk_duration = 600   # seconds; split long audio to bound RAM/VRAM
# use_autocast = true    # fp16; ~2.7x faster, same stems in tests
# overlap = 2            # fewer overlapping windows = faster; default: the model's own

[transcribe]
# model = "large-v3"
# device = "cpu"              # Whisper via CTranslate2; GPU support is issue #19
# compute_type = "int8"
# batch_size = 8
# align_device = "cuda"       # wav2vec2 word alignment (torch ROCm)
# silence_dbfs = -50.0        # drop text found over quieter audio (hallucinations)
# max_segment_seconds = 12.0
# split_pause_seconds = 0.6

[fit]
max_speedup = 1.25
max_fit_iterations = 2

[output]
format = "mkv"                     # mkv | mp4

[gpu]
# RX 7600 (gfx1102) is not on ROCm's official support list, but PyTorch/CTranslate2 ROCm wheels ship gfx1102 kernels.
# Leave unset; set to "11.0.0" (run as gfx1100) only if a library fails with an unsupported-arch error.
# hsa_override_gfx_version = "11.0.0"
