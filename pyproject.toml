[project]
name = "dublador"
version = "0.1.0"
description = "Local AI pipeline that dubs English videos into Brazilian Portuguese"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "dublador-stagekit",
    "rich>=15.0.0",
    "tomli-w>=1.2.0",
    "typer>=0.27.3",
]

[project.scripts]
dublador = "dublador.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests", "packages/stagekit/tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]

[tool.uv.sources]
# Plain path dependency, not a uv workspace: each stage keeps its own lock and venv.
dublador-stagekit = { path = "packages/stagekit", editable = true }

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
