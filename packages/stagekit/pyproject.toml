[project]
name = "dublador-stagekit"
version = "0.1.0"
description = "File contract shared by the dublador orchestrator and its stages"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.23",
    "tomli>=2.0; python_version < '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stagekit"]
