[project]
name = "dublador-stage-fit"
version = "0.1.0"
description = "dublador stage 08: fit each dubbed line into its timing window"
license = "Apache-2.0"
requires-python = "==3.12.*"
dependencies = [
    "dublador-stagekit",
    "numpy",
    "soundfile>=0.12",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fit"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
dublador-stagekit = { path = "../../packages/stagekit", editable = true }
