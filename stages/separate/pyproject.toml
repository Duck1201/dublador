[project]
name = "dublador-stage-separate"
version = "0.1.0"
description = "dublador stage 02: split dialogue from music and effects"
license = "Apache-2.0"
requires-python = "==3.12.*"
dependencies = [
    "dublador-stagekit",
    "audio-separator[cpu]==0.47.*",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    # The ROCm torch wheel needs triton-rocm, which only exists on the PyTorch
    # index; uv applies `sources` to direct dependencies only (docs/MODELS.md).
    "triton-rocm",
    "soundfile>=0.12",
    # audio-separator imports audioread but no longer gets it through librosa.
    "audioread",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/separate"]

[tool.uv]
# Stages only run on Linux x86_64 with ROCm; do not resolve for other platforms.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
dublador-stagekit = { path = "../../packages/stagekit", editable = true }
torch = { index = "pytorch-rocm" }
torchaudio = { index = "pytorch-rocm" }
triton-rocm = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true
