[project]
name = "dublador-stage-translate"
version = "0.1.0"
description = "dublador stage 06: EN to pt-BR translation with a local LLM (Ollama)"
license = "Apache-2.0"
requires-python = "==3.12.*"
dependencies = ["dublador-stagekit"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/translate"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
dublador-stagekit = { path = "../../packages/stagekit", editable = true }
