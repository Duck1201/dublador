[project]
name = "dublador-stage-speakers"
version = "0.1.0"
description = "dublador stage 05: per-speaker voice references, gender and voice choice"
license = "Apache-2.0"
requires-python = "==3.12.*"
dependencies = [
    "dublador-stagekit",
    "numpy",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "scipy",
    "librosa>=0.11",
    # Gender classifier (ECAPA, ecapa_gender.py) runs on the CPU: no ROCm build needed.
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "huggingface-hub",
    "safetensors",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speakers"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
dublador-stagekit = { path = "../../packages/stagekit", editable = true }
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
