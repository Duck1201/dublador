[project]
name = "dublador-stage-diarize"
version = "0.1.0"
description = "dublador stage 04: who speaks when (pyannote community-1)"
license = "Apache-2.0"
requires-python = "==3.12.*"
dependencies = [
    "dublador-stagekit",
    "pyannote.audio==4.0.7",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    # The PyPI torchcodec wheels link against CUDA; the CPU build is enough here.
    "torchcodec==0.11.1",
    # Needed by the ROCm torch wheel and only on the PyTorch index; uv applies
    # `sources` to direct dependencies only (docs/MODELS.md).
    "triton-rocm",
    "soundfile>=0.12",
    "numpy",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diarize"]

[tool.uv]
# Stages only run on Linux x86_64 with ROCm; do not resolve for other platforms.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
dublador-stagekit = { path = "../../packages/stagekit", editable = true }
torch = { index = "pytorch-rocm" }
torchaudio = { index = "pytorch-rocm" }
torchcodec = { index = "pytorch-cpu" }
triton-rocm = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
